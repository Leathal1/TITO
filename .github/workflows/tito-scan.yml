name: Threat Model Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run TITO
        uses: Leathal1/TITO@main
        id: tito
        with:
          maestro: 'true'
          mitre: 'true'
          semgrep: 'true'
          attack-paths: 'true'
          output: threat-model.md
          comment-on-pr: 'true'
          upload-artifact: 'true'
          badge: 'true'

      - name: Check results
        run: |
          echo "Total threats: ${{ steps.tito.outputs.threats-total }}"
          echo "Critical: ${{ steps.tito.outputs.threats-critical }}"
          echo "Badge: ${{ steps.tito.outputs.badge-url }}"
