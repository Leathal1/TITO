name: Threat Model Check

on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  threat-diff:
    runs-on: ubuntu-latest
    name: TITO Threat Diff

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run TITO
        uses: Leathal1/TITO@main
        id: tito
        with:
          diff-base: ${{ github.event.pull_request.base.ref }}
          diff-head: ${{ github.event.pull_request.head.ref }}
          output: threat-diff.md
          fail-on: never
          comment-on-pr: 'true'
          badge: 'true'
